<!DOCTYPE html> <!--indica que es un documento html-->
<html lang="en"> <!--indica el lenguaje del texto del html (español)-->
<head> <!--Seccion donde se guarda informacion tecnica del documento-->
    <meta charset="UTF-8"> <!--Para que la pagina acepte y adapte carácteres especiales-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Para que las dimensiones de la pagina se ajusten al dispositivo automaticamente-->
    <title>Imagenes en HTML</title> <!--Título de la barra de la pagia web-->
</head> <!--Se cierra la seccion de head-->
<body> <!--Comienza el cuerpo del html-->
    <h2>Imagenes en HTML</h2> <!--Encabezado h2-->
    <h3>Locales</h3> <!--Encabezado h3, imagen guardada en la misma carpeta-->
    <img src="caritas.png" alt="Imagen de carita feliz"> <!--src: ruta de la imagen, alt: texto alternativo si no carga-->
    <h3>Locales redismensionado</h3> <!--Encabezado h3, imagen en una subcarpeta con otro tamaño-->
    <img src="imagenes/carita.png" alt="" width="200" height="100"> <!--Ruta en la carpeta imagenes, width y height cambian el tamaño en pixeles-->
    <h3>Desde internet</h3> <!--Encabezado h3, imagen tomada de una URL-->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt=""> <!--src con la direccion web de la imagen, tamaño de 200x200-->
    <h3>Animaciones</h3> <!--Encabezado h3, imagen animada (gif)-->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt=""> <!--Los gif se insertan igual que una imagen normal-->
</body> <!--Se cierra el cuerpo del html-->
</html> <!--Se cierra el documento html-->
