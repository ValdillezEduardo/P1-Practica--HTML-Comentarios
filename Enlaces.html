<!DOCTYPE html> <!--indica que es un documento html-->
<html lang="en"> <!--indica el lenguaje del texto del html (español)-->
<head> <!--Seccion donde se guarda informacion tecnica del documento-->
    <meta charset="UTF-8"> <!--Para que la pagina acepte y adapte carácteres especiales-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Para que las dimensiones de la pagina se ajusten al dispositivo automaticamente-->
    <title>Enlaces en HTML</title> <!--Título de la barra de la pagia web-->
</head> <!--Se cierra la seccion de head-->
<body> <!--Comienza el cuerpo del html-->
    <h2>Tipos de enlaces en HTML</h2> <!--Encabezado h2-->
    <p><strong>Enlaces/Hipervinculos a otra pagina del
         mismo sitio.
    </strong></p> <!--Parrafo en negritas con strong-->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br> <!--Enlace a otro archivo html, href indica el destino, br salta de linea-->
    <a href="2. Encabezados.html" target="_self"> <!--target="_self" abre el enlace en la misma pestaña-->
        2. Encabezados</a><br>
    <a href="3. Parrafos.html" target="_blank"> <!--target="_blank" abre el enlace en una pestaña nueva-->
        3. Parrafos</a><br>
    <a href="4. Salto de linea.html" target="_parent"> <!--target="_parent" abre el enlace en el marco padre-->
        4. Salto de linea</a><br>
    <a href="5. Enfatizado.html" target="_top"> <!--target="_top" abre el enlace en toda la ventana-->
        5. Enfatizado</a><br>
    <p><strong>Enlaces/Hipervinculos a sitios externos
    </strong></p> <!--Parrafo en negritas con strong-->
    <a href="https://www.google.com/">Google</a><br> <!--Enlace a un sitio web externo (URL completa)-->
    <a href="https://www.youtube.com/" target="_self"> <!--Se abre en la misma pestaña-->
        YouTube</a><br>
    <a href="https://www.facebook.com/" target="_blank"> <!--Se abre en una pestaña nueva-->
        FaceBook</a><br>
    <a href="https://www.wikipedia.com/" target="_parent"> <!--Se abre en el marco padre-->
        WikiPedia</a><br>
    <a href="https://www.espanol.yahoo.com/" target="_top"> <!--Se abre en toda la ventana-->
        Yahoo!</a><br>
</body> <!--Se cierra el cuerpo del html-->
</html> <!--Se cierra el documento html-->
